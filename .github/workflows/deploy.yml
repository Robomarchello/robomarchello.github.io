name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Install dependencies
        run: npm ci

      - name: Resolve base path & build static site
        shell: bash
        env:
          CONFIGURED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_lower="$(echo "$repo_name" | tr '[:upper:]' '[:lower:]')"

          # 1. User/organization pages (*.github.io) and custom domains (CNAME) ALWAYS serve from root (/).
          # 2. If configure-pages returned a valid subpath for a project site, use it.
          # 3. Otherwise, project sites default to /<repo>/.
          if [ -f assets/CNAME ] || [ -f CNAME ] || [[ "$repo_lower" == *".github.io" ]]; then
            export BASE_PATH="/"
          elif [ -n "$CONFIGURED_BASE_PATH" ]; then
            export BASE_PATH="$CONFIGURED_BASE_PATH"
          else
            export BASE_PATH="/$repo_name/"
          fi

          echo "Building static site with BASE_PATH=$BASE_PATH"
          npm run build

          # Ensure CNAME file is copied into dist/ if custom domain is defined
          if [ -f assets/CNAME ] && [ ! -f dist/CNAME ]; then
            cp assets/CNAME dist/CNAME
          elif [ -f CNAME ] && [ ! -f dist/CNAME ]; then
            cp CNAME dist/CNAME
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
