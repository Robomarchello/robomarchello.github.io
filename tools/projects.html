<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects · Admin Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tools/tools.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-brand">Robo<span>Tools</span></div>
      <nav>
        <a href="/tools/">Overview</a>
        <a href="/tools/projects.html" class="active">Projects</a>
        <a href="/tools/badges.html">Badges</a>
        <a href="/tools/links.html">Links</a>
        <a href="/tools/posts.html">Posts</a>
      </nav>
      <div class="topbar-actions">
        <span id="dirty-indicator"></span>
        <button type="button" id="save-btn">Save changes</button>
        <button type="button" id="build-btn" class="primary">Build site</button>
      </div>
    </div>

    <div class="layout">
      <div class="panel sticky">
        <div class="panel-head">
          <span class="panel-title">Projects</span>
          <button type="button" id="add-project-btn" class="small">+ Add</button>
        </div>
        <div class="panel-body flush">
          <div class="item-list" id="project-list"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <span class="panel-title" id="editor-title">Editor</span>
          <div style="display: flex; gap: 0.4rem;">
            <button type="button" id="move-up-btn" class="small ghost" title="Move up">↑</button>
            <button type="button" id="move-down-btn" class="small ghost" title="Move down">↓</button>
            <button type="button" id="delete-project-btn" class="small danger">Delete</button>
          </div>
        </div>
        <div class="panel-body" id="editor"></div>
      </div>
    </div>

    <input type="file" id="image-input" accept="image/*" />
    <script type="module" src="/tools/js/projects.js"></script>
  </body>
</html>
